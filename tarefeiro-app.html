<title>Tarefeiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna para celular (max 520px), barra inferior fixa com o + no centro, folhas que sobem de baixo. Visual igual ao Garfada. */
:root{
  --bg:#F6F6F8; --panel:#FFFFFF; --sunk:#F0F0F3; --ink:#0E0E12; --muted:#6E6E78; --line:#EAEAEE;
  --accent:#5A5FE8; --accent-hi:#7D83FF; --accent-soft:#EEEFFF;
  --grad:linear-gradient(135deg,#7D83FF 0%,#A78BFA 55%,#F28CC4 100%);
  --pri:#0E0E12; --pri-ink:#FFFFFF;
  --p1:#FF6B5B; --p2:#F4B13E; --ok:#2FA36B; --ok-soft:#E4F4EB; --warn-soft:#FFF1EF;
  --shadow:0 10px 30px rgba(14,14,18,.08);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0E; --panel:#151519; --sunk:#1E1E24; --ink:#F3F3F6; --muted:#9A9AA6; --line:#25252C;
  --accent:#A3A7FF; --accent-hi:#7D83FF; --accent-soft:#23244A; --pri:#F3F3F6; --pri-ink:#0B0B0E;
  --p1:#FF8476; --p2:#F7C15E; --ok:#46C084; --ok-soft:#163327; --warn-soft:#3A1F1C; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0E; --panel:#151519; --sunk:#1E1E24; --ink:#F3F3F6; --muted:#9A9AA6; --line:#25252C;
  --accent:#A3A7FF; --accent-hi:#7D83FF; --accent-soft:#23244A; --pri:#F3F3F6; --pri-ink:#0B0B0E;
  --p1:#FF8476; --p2:#F7C15E; --ok:#46C084; --ok-soft:#163327; --warn-soft:#3A1F1C; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.brand .when{font-size:12.5px;color:var(--muted);margin:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.banner{border-radius:16px;padding:12px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner b{display:block}
.banner.info{background:var(--accent-soft)}
.banner button{margin-top:6px;font-weight:600;color:var(--accent)}

/* resumo do dia */
.today{display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.today h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.today p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* chips de visão */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.chip.sm{padding:6px 11px;font-size:12.5px}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* grupos e tarefas */
.group{display:flex;flex-direction:column}
.ghead{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 8px}
.ghead h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.ghead h3 small{font-weight:500;color:var(--muted);margin-left:6px}
.ghead button{font-size:12.5px;font-weight:600;color:var(--accent)}
.ghead.late h3{color:var(--p1)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.empty{padding:16px;color:var(--muted);font-size:13.5px;text-align:center}
.free{padding:10px 16px;color:var(--muted);font-size:13px}
.task{position:relative;overflow:hidden;touch-action:pan-y}
.task + .task .tin{border-top:1px solid var(--line)}
.task .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:13px;font-weight:700;color:#fff}
.task .under .l{color:#fff}
.task .under.done{background:var(--ok)}
.task .under.later{background:var(--accent)}
.tin{position:relative;background:var(--panel);display:flex;gap:12px;align-items:flex-start;padding:13px 14px;transition:transform .2s}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .15s}
.check.p1{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 12%,transparent)}
.check.p2{border-color:var(--p2);background:color-mix(in srgb,var(--p2) 12%,transparent)}
.check svg{width:12px;height:12px;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1}
.task.done .ttl{color:var(--muted);text-decoration:line-through}
.check.pop{transform:scale(1.25)}
.tbody{flex:1;min-width:0;text-align:left}
.ttl{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12.5px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:12px;height:12px}
.meta .late{color:var(--p1);font-weight:600}
.ldot{width:7px;height:7px;border-radius:50%;display:inline-block}
.tag-ex{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
details.donebox summary{list-style:none;cursor:pointer;padding:4px;font-size:13.5px;font-weight:600;color:var(--muted)}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox[open] summary{margin-bottom:8px}

/* hábitos */
.hab{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hab + .hab{border-top:1px solid var(--line)}
.hic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.hic.emo{font-size:20px;line-height:1}
.icones{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icones button{aspect-ratio:1/1;border-radius:12px;font-size:20px;line-height:1;background:var(--sunk);border:2px solid transparent;display:grid;place-items:center;min-width:0}
.icones button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.icones button.letra{font-size:14px;font-weight:800;color:var(--muted)}
.hbody{flex:1;min-width:0;text-align:left}
.hname{font-weight:600;font-size:15px}
.hmeta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px}
.week7{display:flex;gap:3px}
.week7 i{width:8px;height:8px;border-radius:3px;background:var(--sunk)}
.week7 i.on{background:var(--ok)}
.week7 i.part{background:color-mix(in srgb,var(--ok) 45%,var(--sunk))}
.hcheck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .15s}
.hcheck svg{width:18px;height:18px;opacity:.25}
.hcheck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hcheck.on svg{opacity:1}
.counter{display:flex;align-items:center;gap:6px;flex:none}
.counter button{width:32px;height:32px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:17px}
.counter .val{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.counter .val.ok{color:var(--ok)}

/* calendário */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h3{margin:0;font-size:16px;font-weight:700;text-transform:capitalize}
.calhead .nav{display:flex;gap:6px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid7 .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.day{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;position:relative;font-size:14px;font-weight:600;min-width:0}
.day.out{color:var(--muted);opacity:.45}
.day.today .n{background:var(--grad);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.day .n{width:26px;height:26px;display:grid;place-items:center}
.day[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.dots i.pv{background:transparent!important;border:1.5px solid;width:5px;height:5px;box-sizing:border-box}
.task.prev .ttl{color:var(--muted)}
.task.prev .check{border-style:dashed;opacity:.7}
.task.prev .meta .pvtag{color:var(--accent);font-weight:600}
.hbar{position:absolute;bottom:5px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.hbar b{display:block;height:100%;background:var(--ok)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{border-radius:14px;padding:8px 0;text-align:center;background:var(--sunk);display:flex;flex-direction:column;gap:2px;align-items:center}
.wday small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.wday b{font-size:16px}
.wday span{font-size:11px;color:var(--muted)}
.wday[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.wday[aria-pressed="true"] small,.wday[aria-pressed="true"] span{color:var(--pri-ink);opacity:.8}

/* progresso */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row label,.row .k{font-weight:500}
.row small{display:block;color:var(--muted);font-size:12.5px}
.row select,.row input[type=text]{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:58%}
.link{color:var(--accent);font-weight:600;text-decoration:none}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 4px 0;font-weight:700}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--pri);color:var(--pri-ink);font-weight:700;font-size:14.5px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.grad{background:var(--grad);color:#fff}
.btn.danger{background:transparent;color:var(--p1)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}

/* barra inferior */
.nav{display:flex}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
nav.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bar .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
nav.bar .tab svg{width:22px;height:22px}
nav.bar .tab[aria-current="page"]{color:var(--ink)}
nav.bar .plus{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 22px rgba(125,131,255,.45);margin-top:-22px}
nav.bar .plus svg{width:26px;height:26px;color:#fff}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:17px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px}
textarea.inp{resize:vertical;min-height:70px}
.inp.big{font-size:17px;padding:13px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.parsed{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;margin:8px 0 12px}
.pchip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pchip.p1{background:var(--warn-soft);color:var(--p1)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.dumprow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dumprow input[type=text]{flex:1;min-width:0;background:transparent;border:0;font-size:14.5px;padding:4px 0}
.dumprow small{color:var(--muted);font-size:12px;white-space:nowrap}
.dumprow .dtxt{flex:1;min-width:0}
.dumprow .dtxt input{width:100%;background:transparent;border:0;font-size:14.5px;padding:4px 0}
.dumprow .dtxt small{display:block;white-space:normal;color:var(--muted)}
.dwhen{flex:none;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.dwhen svg{width:13px;height:13px}
.dwhen.sug{background:color-mix(in srgb,var(--p2) 20%,var(--panel));border-color:var(--p2)}
.dwhen.big{font-size:15px;padding:11px 14px;border-radius:12px;width:100%;justify-content:flex-start}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
/* calendário de escolha (dia + horário) */
.pk{background:var(--sunk);border-radius:16px;padding:10px 10px 12px;margin:4px 0 12px}
.pkhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pkhead b{font-size:14.5px}
.pkhead button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.pkhead svg{width:16px;height:16px}
.pkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pkgrid .wd{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:3px 0}
.pkgrid button{aspect-ratio:1/1;border-radius:50%;font-size:14px;font-weight:600;min-width:0;max-height:44px;justify-self:center;width:100%;max-width:44px}
.pkgrid button.out{opacity:.4}
.pkgrid button.hj{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pkgrid button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:none}
.pkgrid button:disabled{opacity:.22;cursor:default}
.pktimes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.pktimes .chip{background:var(--panel)}
.pktimes .chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.pktimes input{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.pkok{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.rp .chips{flex-wrap:wrap;overflow:visible}
.rp .chips .chip{background:var(--panel)}
.rp .chips .chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.rpdias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.rpdias button{height:38px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--panel);border:1px solid var(--line);min-width:0}
.rpdias button[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.rpnum{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.rpnum input{width:72px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.dwhen.rep{color:var(--accent)}
.dbtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
.subrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.subrow .check{width:20px;height:20px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 40%,var(--sunk))}
.heat i.l2{background:var(--ok)}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.wdpick{display:flex;gap:6px;flex-wrap:wrap}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--pri);color:var(--pri-ink);
  padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;transition:all .2s;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast span{min-width:0}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--accent-hi);font-weight:700}

/* Tarefeirinho (mascote de pixel no topo) */
.top{position:relative}
.topr{display:flex;align-items:center;gap:6px}
.masc{width:44px;height:48px;flex:none;display:grid;place-items:center;position:relative}
.masc[hidden],.field[hidden]{display:none}
.masc svg{width:42px;height:45px;overflow:visible}
.corpo{animation:boia 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.masc.dormindo .corpo{animation:respira 3.8s ease-in-out infinite}
.olho{animation:pisca 4.6s infinite;transform-box:fill-box;transform-origin:center}

  border-radius:16px 4px 16px 16px;padding:10px 13px;font-size:13.5px;line-height:1.38;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .18s,transform .18s;pointer-events:none}

<script id="core">
/* ===== Núcleo: datas, repetição e leitura de texto corrido (sem acesso à tela) ===== */
var WD = ['dom','seg','ter','qua','qui','sex','sab'];
var WD_LONGO = ['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
var WD_NOME = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000)}
function weekday(s){return parseYmd(s).getDay()}
function stamp(d){d=d||new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function fold(s){return Array.from(String(s||'')).map(function(c){return c.normalize('NFD')[0]}).join('').toLowerCase()}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function startOfWeek(s,inicio){var w=weekday(s);var off=inicio==='dom'?w:(w+6)%7;return addDays(s,-off)}

/** Partes da repetição: base ("semanal:seg"), ate (último dia, opcional) e pula (dias tirados da série). */
function repPartes(rep){var a=String(rep||'').split('|'),o={base:a[0],ate:'',pula:[]};a.slice(1).forEach(function(x){if(x.indexOf('ate:')===0)o.ate=x.slice(4);else if(x.indexOf('pula:')===0)o.pula=x.slice(5).split(',').filter(Boolean)});return o}
function repMontar(o){if(!o.base)return '';var r=o.base;if(o.ate)r+='|ate:'+o.ate;if(o.pula&&o.pula.length)r+='|pula:'+o.pula.join(',');return r}
/** Próxima data de uma tarefa que repete, respeitando o fim e os dias pulados. */
function nextOccurrence(rep,base,hoje){
  var o=repPartes(rep);if(!o.base)return '';
  var r=proxBase(o.base,base,hoje),n=0;
  while(r&&o.pula.indexOf(r)>=0&&n++<60)r=proxBase(o.base,r,r);
  return r&&o.ate&&r>o.ate?'':r;
}
function proxBase(rep,base,hoje){
  rep=String(rep||'');if(!rep)return '';
  var from=base&&base>hoje?base:(base||hoje);
  if(rep!=='mensal'&&rep.indexOf('mensal')!==0&&from<hoje)from=hoje;
  if(rep==='diaria')return addDays(from,1);
  if(rep==='dias_uteis'){var d=addDays(from,1);while(weekday(d)===0||weekday(d)===6)d=addDays(d,1);return d}
  if(rep.indexOf('semanal')===0){
    var set=(rep.split(':')[1]||WD[weekday(base||hoje)]).split(',');
    for(var i=1;i<=7;i++){var c=addDays(from,i);if(set.indexOf(WD[weekday(c)])>=0)return c}
    return addDays(from,7);
  }
  if(rep.indexOf('mensal')===0){
    var dia=+(rep.split(':')[1])||parseYmd(base||hoje).getDate();
    var b=parseYmd(base||hoje);var y=b.getFullYear(),m=b.getMonth()+1;
    var cand=function(){if(m>11){m=0;y++}return ymd(new Date(y,m,Math.min(dia,daysInMonth(y,m))))};
    var r=cand();while(r<=hoje){m++;r=cand()}
    return r;
  }
  var cm=rep.match(/^cada:(\d+)d$/);if(cm)return addDays(from,Math.max(1,+cm[1]));
  return '';
}

function repLabel(rep){
  var o=repPartes(rep),l=repLabelBase(o.base);if(!l)return '';
  if(o.ate){var d=parseYmd(o.ate);l+=' até '+pad(d.getDate())+'/'+pad(d.getMonth()+1)}
  return l;
}
function repLabelBase(rep){
  rep=String(rep||'');if(!rep)return '';
  if(rep==='diaria')return 'Todo dia';
  if(rep==='dias_uteis')return 'Dias úteis';
  if(rep.indexOf('semanal')===0){var d=(rep.split(':')[1]||'').split(',').filter(Boolean);var nm=d.map(function(c){var i=WD.indexOf(c);return i<0?c:WD_NOME[i].toLowerCase().replace('ç','ç')});return nm.length?(nm.length===1&&(nm[0]==='sábado'||nm[0]==='domingo')?'Todo ':'Toda ')+(nm.length>1?nm.slice(0,-1).join(', ')+' e '+nm[nm.length-1]:nm[0]):'Toda semana'}
  if(rep.indexOf('mensal')===0){var n=rep.split(':')[1];return n?'Todo dia '+n:'Todo mês'}
  var c=rep.match(/^cada:(\d+)d$/);if(c)return 'A cada '+c[1]+' dias';
  return rep;
}

/** Próxima data (incluindo hoje) que cai no dia da semana w. */
function nextWeekday(hoje,w){var d=hoje;for(var i=0;i<7;i++){if(weekday(d)===w)return d;d=addDays(d,1)}return d}

/**
 * Lê "pagar DAS sexta 10h #trabalho !1" e devolve os campos.
 * listas: [{id,nome}] — "#nome" que não existir volta em novaLista.
 */
function parseCapture(text,hoje,listas){
  var orig=String(text||'');var f=fold(orig);
  var out={titulo:'',data:'',hora:'',prioridade:'',lista_id:'',novaLista:'',repeticao:'',marcas:[]};
  var cortes=[];
  function take(re,fn){
    re.lastIndex=0;var m=re.exec(f);if(!m)return false;
    var ini=m.index+(m[1]&&m[0].indexOf(m[1])===0&&/^\s$/.test(m[1])?1:0);
    for(var i=0;i<cortes.length;i++){if(ini<cortes[i][1]&&m.index+m[0].length>cortes[i][0])return false}
    if(fn(m)===false)return false;
    cortes.push([m.index,m.index+m[0].length]);return true;
  }
  var WDRE='(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-feira)?s?';
  // repetição
  take(/\btodo dia (\d{1,2})\b/,function(m){var n=+m[1];if(n<1||n>31)return false;out.repeticao='mensal:'+n;
    var b=parseYmd(hoje),y=b.getFullYear(),mo=b.getMonth();if(n<b.getDate()){mo++;if(mo>11){mo=0;y++}}
    out.temData=true,out.data=ymd(new Date(y,mo,Math.min(n,daysInMonth(y,mo))))});
  take(/\btodo mes\b/,function(){out.repeticao='mensal:'+parseYmd(hoje).getDate()});
  take(/\b(?:dias uteis|todo dia util)\b/,function(){out.repeticao='dias_uteis'});
  take(/\b(?:todo dia|todos os dias|diariamente)\b/,function(){out.repeticao='diaria'});
  var WDN='(?:segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-feira)?s?';
  take(new RegExp('\\b(?:toda|todo|todas as|todos os) ('+WDN+'(?:(?:, *| e | ou )'+WDN+')*)\\b'),function(m){
    var ws=[],r=new RegExp(WDRE,'g'),x;while((x=r.exec(m[1]))){var w=WD_LONGO.indexOf(x[1]);if(w>=0&&ws.indexOf(w)<0)ws.push(w)}
    ws.sort(function(a,b){return (a+6)%7-(b+6)%7});out.repeticao='semanal:'+ws.map(function(w){return WD[w]}).join(',');
    out.temData=true,out.data=out.data||ws.map(function(w){return nextWeekday(hoje,w)}).sort()[0]});
  take(/\btoda semana\b/,function(){out.repeticao='semanal:'+WD[weekday(hoje)]});
  take(/\ba cada (\d{1,3}) dias\b/,function(m){out.repeticao='cada:'+Math.max(1,+m[1])+'d'});
  // data
  take(/\bdepois de amanha\b/,function(){out.temData=true,out.data=addDays(hoje,2)});
  take(/\bamanha\b/,function(){out.temData=true,out.data=addDays(hoje,1)});
  take(/\bhoje\b/,function(){out.temData=true,out.data=hoje});
  take(/\b(?:proxima semana|semana que vem)\b/,function(){out.temData=true,out.data=nextWeekday(addDays(hoje,1),1)});
  take(/\b(?:no |neste |este )?fim de semana\b/,function(){var w=weekday(hoje);out.temData=true,out.data=(w===6||w===0)?hoje:nextWeekday(hoje,6)});
  take(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/,function(m){
    var d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return false;
    var y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):parseYmd(hoje).getFullYear();
    var s=ymd(new Date(y,mo-1,Math.min(d,daysInMonth(y,mo-1))));if(!m[3]&&s<hoje)s=ymd(new Date(y+1,mo-1,Math.min(d,daysInMonth(y+1,mo-1))));out.temData=true,out.data=s});
  take(/\b(?:no |ate o |ate )?dia (\d{1,2})\b/,function(m){
    var n=+m[1];if(n<1||n>31)return false;var b=parseYmd(hoje);var y=b.getFullYear(),mo=b.getMonth();
    if(n<b.getDate()){mo++;if(mo>11){mo=0;y++}}
    out.temData=true,out.data=ymd(new Date(y,mo,Math.min(n,daysInMonth(y,mo))))});
  take(new RegExp('\\b(?:na |no |nesta |neste |proxima |proximo |ate )?'+WDRE+'\\b'),function(m){out.temData=true,out.data=nextWeekday(hoje,WD_LONGO.indexOf(m[1]))});
  // hora
  take(/\b(?:as |a )?(\d{1,2})(?:h|:)(\d{2})?(?:min)?\b/,function(m){var h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return false;out.hora=pad(h)+':'+pad(mi)});
  take(/\b(?:as) (\d{1,2})\b/,function(m){var h=+m[1];if(h>23)return false;out.hora=pad(h)+':00'});
  // prioridade
  take(/(^|\s)!([123])\b/,function(m){out.prioridade=m[2]});
  // lista
  take(/(^|\s)#([a-z0-9_-]+)/,function(m){
    var nome=m[2];var achou=(listas||[]).filter(function(l){return fold(l.nome).replace(/\s+/g,'')===nome.replace(/[-_]/g,'')||fold(l.nome)===nome})[0];
    if(achou)out.lista_id=achou.id;else{var ini=m.index+m[1].length+1;out.novaLista=orig.substr(ini,nome.length)}
  });
  if(out.repeticao&&!out.data)out.temData=true,out.data=hoje;
  // título = texto sem os trechos reconhecidos
  cortes.sort(function(a,b){return b[0]-a[0]});
  var t=orig;cortes.forEach(function(c){t=t.slice(0,c[0])+' '+t.slice(c[1])});
  t=t.replace(/\s+/g,' ').trim();
  for(var k=0;k<3;k++)t=t.replace(/\s+(na|no|para|pra|ate|até|as|às|de|em|a|o|e)$/i,'').trim();
  out.titulo=t;
  if(out.data)out.marcas.push({tipo:'data',txt:rotuloData(out.data,hoje)});
  if(out.hora)out.marcas.push({tipo:'hora',txt:out.hora.replace(':00','h').replace(':','h')});
  if(out.repeticao)out.marcas.push({tipo:'rep',txt:repLabel(out.repeticao)});
  if(out.prioridade)out.marcas.push({tipo:'p'+out.prioridade,txt:out.prioridade==='1'?'Prioridade alta':out.prioridade==='2'?'Prioridade média':'Prioridade normal'});
  if(out.lista_id){var l=(listas||[]).filter(function(x){return x.id===out.lista_id})[0];out.marcas.push({tipo:'lista',txt:l.nome})}
  if(out.novaLista)out.marcas.push({tipo:'lista',txt:'Nova lista: '+out.novaLista});
  return out;
}

function rotuloData(s,hoje){
  if(!s)return 'Sem data';
  var d=diffDays(hoje,s);
  if(d===0)return 'Hoje';if(d===1)return 'Amanhã';if(d===-1)return 'Ontem';
  var dt=parseYmd(s);
  if(d>1&&d<7)return WD_NOME[dt.getDay()];
  return pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+(dt.getFullYear()!==parseYmd(hoje).getFullYear()?'/'+dt.getFullYear():'');
}

/** O hábito vale para o dia s? */
function habitoNoDia(h,s){
  if(h.ativo==='nao')return false;
  if(h.criado_em&&s<String(h.criado_em).slice(0,10))return false;
  if(h.termina_em&&s>h.termina_em)return false;
  if(h.frequencia==='dias'){return String(h.dias||'').split(',').indexOf(WD[weekday(s)])>=0}
  return true;
}

/** Sequência atual: dias (ou semanas) seguidos cumprindo a meta. valorDia(s) devolve o total do dia. */
function sequencia(h,hoje,valorDia,inicio){
  var meta=+h.meta_dia||1;
  if(h.frequencia==='semana'){
    var alvo=+h.dias||3;var semana=startOfWeek(hoje,inicio);var n=0;
    var feitos=function(ini){var c=0;for(var i=0;i<7;i++){if(valorDia(addDays(ini,i))>=meta)c++}return c};
    if(feitos(semana)>=alvo)n++;
    var w=addDays(semana,-7);
    for(var k=0;k<104;k++){if(feitos(w)>=alvo){n++;w=addDays(w,-7)}else break}
    return {n:n,unidade:n===1?'semana':'semanas'};
  }
  var d=hoje,c=0;
  if(!(habitoNoDia(h,d)&&valorDia(d)>=meta))d=addDays(d,-1);
  for(var i=0;i<730;i++){
    if(h.criado_em&&d<String(h.criado_em).slice(0,10))break;
    if(!habitoNoDia(h,d)){d=addDays(d,-1);continue}
    if(valorDia(d)>=meta){c++;d=addDays(d,-1)}else break;
  }
  return {n:c,unidade:c===1?'dia':'dias'};
}
</script>

<script>
/* ===== App ===== */
var SERVER='Google Sheets';
var PLANILHA_PADRAO='COLE_AQUI_O_ID_DA_PLANILHA';
var COLS={
  Tarefas:['id','titulo','notas','data','hora','prioridade','lista_id','etiquetas','status','concluida_em','repeticao','tarefa_mae_id','origem','google_task_id','google_list_id','google_atualizado_em','atualizado_em','criado_em','evento_id'],
  Listas:['id','nome','cor','ordem','google_list_id','atualizado_em'],
  Habitos:['id','nome','icone','cor','frequencia','dias','meta_dia','unidade','periodo','ativo','ordem','criado_em','termina_em'],
  Checkins:['id','habito_id','data','valor','criado_em'],
  Config:['campo','valor','descricao']
};
var LETRA={Tarefas:'S',Listas:'F',Habitos:'M',Checkins:'E',Config:'C'};
var CORES=['#5A5FE8','#F4B13E','#2FA36B','#FF6B5B','#4D9DFF','#A78BFA','#F28CC4','#0E9AA7'];
var PERIODOS=[['manha','Manhã'],['tarde','Tarde'],['noite','Noite'],['qualquer','Qualquer hora']];

var S={tab:'tarefas',visao:null,tarefas:[],listas:[],habitos:[],checkins:[],config:[],exemplo:false,carregado:false,
  calModo:'mes',calMes:null,calDia:null,ultimaCarga:0,erro:null};
var mcp=null,sample=null,perms=null;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function planilhaId(){return ls('tarefeiro.planilha')||PLANILHA_PADRAO}
function hoje(){return ymd(new Date())}
function novoId(p){return p+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*1296).toString(36).toUpperCase()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cfg(campo,padrao){var r=S.config.filter(function(c){return c.campo===campo})[0];return r&&r.valor!==''?r.valor:padrao}
function lista(id){return S.listas.filter(function(l){return l.id===id})[0]}
function corLista(id){var l=lista(id);return l?l.cor||CORES[0]:'var(--muted)'}
function $(id){return document.getElementById(id)}

/* ---------- planilha ---------- */
function linhaParaObj(aba,valores,linha){var o={_linha:linha};COLS[aba].forEach(function(c,i){o[c]=valores[i]==null?'':String(valores[i])});return o}
function colsGravar(aba){if(aba==='Habitos'&&S.fimHabito===false)return COLS.Habitos.slice(0,12);if(aba==='Tarefas'&&S.colEvento===false)return COLS.Tarefas.slice(0,18);return COLS[aba]}
function letraGravar(aba){return aba==='Habitos'&&S.fimHabito===false?'L':aba==='Tarefas'&&S.colEvento===false?'R':LETRA[aba]}
function objParaLinha(aba,o){return colsGravar(aba).map(function(c){var v=o[c];if(aba==='Checkins'&&c==='valor')return +v||0;return v==null?'':String(v)})}

function erroTexto(e){
  var c=e&&e.code;
  if(c==='server_not_connected')return {t:'O Google Sheets não está conectado',d:'No Claude Desktop, abra Artefatos → Painel → Chat e conecte o Google Sheets. Depois toque em atualizar.'};
  if(c==='needs_reauth')return {t:'A conexão com o Google Sheets venceu',d:'Reconecte o Google Sheets nos conectores do Claude e toque em atualizar.'};
  if(c==='not_in_manifest'||c==='not_granted')return {t:'O app ainda não tem permissão para usar sua planilha',d:'Toque em Permissões e libere o Google Sheets.',perm:true};
  if(c==='approval_required')return {t:'Falta aprovar o acesso à planilha',d:'Toque em Permitir quando o Claude pedir. Escolha "Sempre permitir" para não perguntar de novo.',perm:true};
  if(c==='selection_required')return {t:'Você tem mais de um Google Sheets conectado',d:'Escolha qual usar no aviso do Claude e toque em atualizar.'};
  if(c==='blocked_by_policy')return {t:'Sua organização bloqueou o Google Sheets aqui',d:'Fale com quem administra a conta do Claude.'};
  if(c==='server_unavailable'||c==='rate_limited')return {t:'O Google Sheets não respondeu agora',d:'Tente de novo em alguns segundos.'};
  if(ehCota(e))return {t:'O Google pediu uma pausa',d:'Foram muitos pedidos à planilha em pouco tempo. Espere um minuto e tente de novo.'};
  if(c==='tool_error')return {t:'A planilha recusou o pedido',d:'Confira em Mais → Ajustes se o ID da planilha está certo. Detalhe: '+String(e.message||'').slice(0,160)};
  return {t:'Não consegui falar com a planilha',d:String(e&&e.message||e||'Erro desconhecido').slice(0,200)};
}

async function chamar(tool,input){var r=await mcp.callTool(SERVER,tool,input,{cache:false});return r.payload}
function ehCota(e){return !!e&&(e.code==='rate_limited'||/quota|rate.?limit|429|RESOURCE_EXHAUSTED|too many requests/i.test(String(e.message||'')))}
function esperar(ms){return new Promise(function(r){setTimeout(r,ms)})}
function salvarCache(){ls('tarefeiro.cache.'+planilhaId(),JSON.stringify({tarefas:S.tarefas,listas:S.listas,habitos:S.habitos,checkins:S.checkins,config:S.config,em:S.ultimaCarga}))}

// leitura: uma por vez; se o Google pedir pausa, mostra a cópia do aparelho e tenta de novo sozinho
var cargaEmCurso=null,pausaMs=0,pausaT=null;
function carregar(silencioso){
  if(cargaEmCurso)return cargaEmCurso;
  if(silencioso&&Date.now()<(S.pausaAte||0))return Promise.resolve();
  cargaEmCurso=lerPlanilha(silencioso).finally(function(){cargaEmCurso=null});
  return cargaEmCurso;
}
async function lerPlanilha(silencioso){
  if(!mcp){return}
  var btn=$('refreshBtn');btn.classList.add('spin');
  try{
    var id=planilhaId();
    if(!/^[A-Za-z0-9_-]{25,}$/.test(id)){S.erro={t:'Falta ligar sua planilha',d:'Abra Mais e cole o link da sua planilha "Tarefeiro, banco de dados" no campo ID da planilha.'};render();return}
    var abas=['Tarefas','Listas','Habitos','Checkins','Config'];
    await fila; // não lê por cima de uma gravação que ainda está na fila
    // uma leitura só para as cinco abas (o Google limita leituras por minuto)
    var res=await chamar('get_spreadsheet',{spreadsheetId:id,includeGridData:true,ranges:abas.map(function(a){return a==='Habitos'||a==='Tarefas'?a:a+'!A1:'+LETRA[a]}),
      fields:['sheets.properties.title','sheets.data.rowData.values.formattedValue']});
    var porAba={};((res&&res.sheets)||[]).forEach(function(sh){
      var rows=(sh.data&&sh.data[0]&&sh.data[0].rowData)||[];
      porAba[sh.properties.title]=rows.map(function(r){return (r.values||[]).map(function(c){return c&&c.formattedValue!=null?c.formattedValue:''})});
    });
    if(!porAba.Tarefas)throw {code:'tool_error',message:'A planilha não tem a aba Tarefas. Confira o ID em Mais → Ajustes.'};
    // a coluna termina_em só é usada se a planilha tiver o cabeçalho dela
    S.fimHabito=((porAba.Habitos||[])[0]||[]).indexOf('termina_em')>=0;
    S.colEvento=((porAba.Tarefas||[])[0]||[]).indexOf('evento_id')>=0;
    abas.forEach(function(a){
      var vals=porAba[a]||[];var arr=[];
      for(var r=1;r<vals.length;r++){if(vals[r]&&vals[r][0])arr.push(linhaParaObj(a,vals[r],r+1))}
      S[{Tarefas:'tarefas',Listas:'listas',Habitos:'habitos',Checkins:'checkins',Config:'config'}[a]]=arr;
    });
    S.listas.sort(function(a,b){return (+a.ordem||0)-(+b.ordem||0)});
    S.exemplo=false;S.carregado=true;S.erro=null;S.ultimaCarga=Date.now();pausaMs=0;S.pausaAte=0;
    salvarCache();
    if(!S.visao)S.visao=cfg('visao_padrao','hoje');
    render();mascSaudar();
  }catch(e){
    if(ehCota(e)){
      // segue com a cópia do aparelho e tenta de novo depois, sem assustar
      pausaMs=Math.min(pausaMs?pausaMs*2:65000,300000);S.pausaAte=Date.now()+pausaMs;
      S.erro={t:'O Google pediu uma pausa curta',d:(S.carregado?'Você está vendo a cópia guardada no aparelho e pode continuar usando. ':'')+'Eu atualizo sozinho daqui a '+Math.round(pausaMs/60000)+' min.',leve:true};
      clearTimeout(pausaT);pausaT=setTimeout(function(){carregar(true)},pausaMs+500);render();
    }else{
      S.erro=erroTexto(e);render();
      if(!silencioso&&S.carregado)toast(S.erro.t);
    }
  }finally{btn.classList.remove('spin')}
}

// fila: uma escrita por vez; pausa do Google = espera e tenta de novo; outro erro = desfaz na tela
var fila=Promise.resolve(),avisouPausa=false;
function gravar(fn,desfazer,msgErro){
  if(S.exemplo){return Promise.resolve()}
  var tentar=function(n){return Promise.resolve().then(fn).catch(function(e){
    if(ehCota(e)&&n<5){
      if(!avisouPausa){avisouPausa=true;toast('O Google pediu uma pausa. Sua alteração está guardada e vai para a planilha em instantes.')}
      return esperar(15000*(n+1)).then(function(){return tentar(n+1)});
    }
    throw e;
  })};
  fila=fila.then(function(){return tentar(0)}).then(function(){avisouPausa=false;salvarCache()}).catch(function(e){
    avisouPausa=false;if(desfazer)desfazer();render();
    var t=erroTexto(e);toast((msgErro||'Não gravou')+': '+t.t);
  });
  return fila;
}
async function anexar(aba,obj){
  var p=await chamar('append_values',{spreadsheetId:planilhaId(),range:aba+'!A1',values:[objParaLinha(aba,obj)]});
  var m=String(p&&p.updates&&p.updates.updatedRange||'').match(/![A-Z]+(\d+)/);
  if(m)obj._linha=+m[1];else await carregar(true);
}
async function atualizarLinha(aba,obj){
  if(!obj._linha){await carregar(true);var o=S[{Tarefas:'tarefas',Listas:'listas',Habitos:'habitos',Checkins:'checkins'}[aba]].filter(function(x){return x.id===obj.id})[0];if(o)obj._linha=o._linha}
  if(!obj._linha)throw {code:'tool_error',message:'linha não encontrada'};
  await chamar('update_values',{spreadsheetId:planilhaId(),range:aba+'!A'+obj._linha+':'+letraGravar(aba)+obj._linha,values:[objParaLinha(aba,obj)]});
}
function salvarConfig(campo,valor){
  var r=S.config.filter(function(c){return c.campo===campo})[0];
  if(r){var antes=r.valor;r.valor=valor;gravar(function(){return chamar('update_values',{spreadsheetId:planilhaId(),range:'Config!B'+r._linha,values:[[String(valor)]]})},function(){r.valor=antes})}
  else{r={campo:campo,valor:valor,descricao:''};S.config.push(r);gravar(function(){return anexar('Config',r)})}
}

/* ---------- tarefas: ações ---------- */
function criarTarefa(dados){
  var t={id:novoId('T'),titulo:dados.titulo,notas:dados.notas||'',data:dados.data||'',hora:dados.hora||'',prioridade:dados.prioridade||'3',
    lista_id:dados.lista_id||cfg('lista_padrao',S.listas[0]&&S.listas[0].id||''),etiquetas:'',status:'aberta',concluida_em:'',repeticao:dados.repeticao||'',
    tarefa_mae_id:dados.tarefa_mae_id||'',origem:dados.origem||'app',google_task_id:'',google_list_id:'',google_atualizado_em:'',atualizado_em:stamp(),criado_em:stamp(),evento_id:''};
  S.tarefas.push(t);render();
  gravar(function(){return anexar('Tarefas',t)},function(){S.tarefas=S.tarefas.filter(function(x){return x!==t})},'A tarefa não foi salva');
  agendaSync(t,null);
  if(t.origem!=='repeticao'&&!t.tarefa_mae_id)mascNova();
  return t;
}
function editarTarefa(t,mudancas,msgDesfazer){
  var antes=Object.assign({},t);Object.assign(t,mudancas,{atualizado_em:stamp()});render();
  gravar(function(){return atualizarLinha('Tarefas',t)},function(){Object.assign(t,antes)},'A alteração não foi salva');
  agendaSync(t,antes);
  if(msgDesfazer)toast(msgDesfazer,function(){var agora=Object.assign({},t);Object.assign(t,antes,{atualizado_em:stamp(),evento_id:t.evento_id});render();gravar(function(){return atualizarLinha('Tarefas',t)});agendaSync(t,agora)});
}
function concluir(t){
  if(t.status==='feita'){editarTarefa(t,{status:'aberta',concluida_em:''});return}
  editarTarefa(t,{status:'feita',concluida_em:stamp()},'Feita: '+t.titulo);
  if(t.repeticao){
    var prox=nextOccurrence(t.repeticao,t.data,hoje());
    if(prox&&!S.tarefas.some(function(x){return x.status==='aberta'&&x.titulo===t.titulo&&x.data===prox&&x.repeticao===t.repeticao})){
      criarTarefa(copiaSerie(t,prox));
    }
  }
  mascFeita();
}
/* alertas: tarefa com horário vira evento no Google Agenda, que avisa no celular mesmo com o app fechado */
var AGENDA='Google Calendar',filaAgenda=Promise.resolve(),agendaAvisou=false;
function agendaLigada(){return cfg('agenda_ligada','nao')==='sim'&&!!mcp&&S.colEvento!==false}
function agendaMin(){var n=+cfg('agenda_minutos','15');return isNaN(n)?15:Math.max(0,n)}
function agoraHm(){var d=new Date();return hoje()+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function querEvento(t){return t.status==='aberta'&&!t.tarefa_mae_id&&!!t.data&&!!t.hora&&(t.data+'T'+t.hora)>=agoraHm()}
function fimEvento(data,hora){var d=new Date(data+'T'+hora+':00');d.setMinutes(d.getMinutes()+30);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'}
async function chamarAgenda(tool,input){var r=await mcp.callTool(AGENDA,tool,input,{cache:false});var p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}return p}
function naoAchou(e){return /not.?found|404|410|deleted|cancel/i.test(String(e&&e.message||''))}
function agendaErro(e){
  if(agendaAvisou)return;agendaAvisou=true;var c=e&&e.code;
  if(c==='server_not_connected')toast('Para os alertas, conecte o Google Agenda no Claude (Artefatos → Painel → Chat)');
  else if(c==='not_granted'||c==='not_in_manifest'||c==='approval_required')toast('Libere o Google Agenda em Mais → Permissões para criar os alertas');
  else if(!ehCota(e))toast('Não consegui criar o alerta na agenda agora');
}
function gravarEvento(t){gravar(function(){return atualizarLinha('Tarefas',t)})}
function eventoDados(t){return {summary:t.titulo,startTime:t.data+'T'+t.hora+':00',endTime:fimEvento(t.data,t.hora),overrideReminders:[{method:'popup',minutes:agendaMin()}],notificationLevel:'NONE'}}
// decide criar, mudar ou apagar o evento; força = refaz mesmo sem mudança (ex.: troca dos minutos)
function agendaSync(t,antes,forca){
  if(!agendaLigada())return;
  var sig=function(x){return [x.titulo,x.data,x.hora,x.status,x.tarefa_mae_id].join('|')};
  if(!forca&&antes&&sig(antes)===sig(t))return;
  filaAgenda=filaAgenda.then(async function(){
    try{
      var quer=querEvento(t);
      if(quer&&t.evento_id){
        try{await chamarAgenda('update_event',Object.assign({eventId:t.evento_id},eventoDados(t)));return}
        catch(e){if(!naoAchou(e))throw e;t.evento_id=''}
      }
      if(quer&&!t.evento_id){
        var r=await chamarAgenda('create_event',Object.assign({description:'Criado pelo Tarefeiro',availability:'AVAILABILITY_FREE'},eventoDados(t)));
        if(r&&r.id){t.evento_id=r.id;gravarEvento(t)}
      }else if(!quer&&t.evento_id){
        var id=t.evento_id;t.evento_id='';gravarEvento(t);
        try{await chamarAgenda('delete_event',{eventId:id,notificationLevel:'NONE'})}catch(e){if(!naoAchou(e))throw e}
      }
    }catch(e){agendaErro(e)}
  });
}
function agendaTodas(modo){
  agendaAvisou=false;var n=0;if(!mcp)return 0;
  S.tarefas.forEach(function(t){
    if(modo==='criar'&&querEvento(t)&&!t.evento_id){agendaSync(t,null,true);n++}
    else if(modo==='atualizar'&&t.evento_id&&querEvento(t)){agendaSync(t,null,true);n++}
    else if(modo==='apagar'&&t.evento_id){n++;var id=t.evento_id;t.evento_id='';gravarEvento(t);
      filaAgenda=filaAgenda.then(function(){return chamarAgenda('delete_event',{eventId:id,notificationLevel:'NONE'}).catch(function(e){if(!naoAchou(e))agendaErro(e)})})}
  });
  return n;
}
// bip, vibração e aviso do mascote quando a tarefa está chegando (só com o app aberto)
var alertados={};
function bip(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;bip.ctx=bip.ctx||new C();var c=bip.ctx;if(c.state==='suspended')c.resume();
  [0,.2].forEach(function(dt){var o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+dt;o.type='sine';o.frequency.value=dt?1175:880;
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.16);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+.18)})}catch(e){}}
document.addEventListener('pointerdown',function(){try{var C=window.AudioContext||window.webkitAudioContext;if(C&&!bip.ctx){bip.ctx=new C()}if(bip.ctx&&bip.ctx.state==='suspended')bip.ctx.resume()}catch(e){}},{once:true});
function checarAlertas(){
  if(cfg('bip','sim')==='nao')return;
  var agora=Date.now(),janela=(agendaMin()||15)*60000;
  doDia(hoje()).forEach(function(t){
    if(!t.hora)return;var falta=new Date(t.data+'T'+t.hora+':00').getTime()-agora;
    if(falta>janela||falta<-60000)return;
    var k=t.id+'|'+t.data+'|'+t.hora;if(alertados[k]||ls('tarefeiro.bip.'+k))return;
    alertados[k]=1;ls('tarefeiro.bip.'+k,'1');
    var min=Math.round(falta/60000),msg=t.titulo+(min>0?', daqui a '+min+' min':', agora');
    bip();vibrar();toast('Lembrete: '+msg);if(mascLigado())mascReagir('preocupado','pula','Lembrete: '+msg,6000);
  });
}
function copiaSerie(t,data){var o=repPartes(t.repeticao);o.pula=o.pula.filter(function(d){return d>data});
  return {titulo:t.titulo,notas:t.notas,data:data,hora:t.hora,prioridade:t.prioridade,lista_id:t.lista_id,repeticao:repMontar(o),origem:'repeticao'}}
function repComPulo(rep,d){var o=repPartes(rep);if(o.pula.indexOf(d)<0)o.pula.push(d);o.pula.sort();return repMontar(o)}
function repComFim(rep,d){var o=repPartes(rep);o.ate=d;o.pula=o.pula.filter(function(x){return x<=d});return repMontar(o)}
// pergunta "só esta ou as próximas" antes de mexer numa tarefa que repete
var ESCOPO=null;
function perguntarEscopo(titulo,texto,op1,op2,fn1,fn2){
  ESCOPO=[fn1,fn2];
  abrir('<h3>'+esc(titulo)+'</h3><p class="hint">'+esc(texto)+'</p><div style="display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn block" data-escopo="0">'+esc(op1)+'</button><button class="btn ghost block" data-escopo="1">'+esc(op2)+'</button>'+
    '<button class="btn ghost block" data-escopo="x" style="color:var(--muted)">Cancelar</button></div>');
}
function adiar(t,data,hora){editarTarefa(t,hora!==undefined?{data:data,hora:hora}:{data:data},data?'Remarcada para '+rotuloData(data,hoje()).toLowerCase():'Tarefa sem data');
  mascReagir('feliz','mexe',data?'Sem culpa. Fica para '+rotuloData(data,hoje()).toLowerCase()+'.':'Guardei sem data. Ela aparece em Tudo.',2200)}

/* ---------- hábitos: ações ---------- */
function valorDia(hid,s){var v=0;S.checkins.forEach(function(c){if(c.habito_id===hid&&c.data===s)v+=+c.valor||0});return v}
function marcarHabito(h,s,delta){
  var meta=+h.meta_dia||1;
  var c=S.checkins.filter(function(x){return x.habito_id===h.id&&x.data===s})[0];
  var atual=c?+c.valor||0:0;
  var novo=delta===null?(atual>=meta?0:meta):Math.max(0,atual+delta);
  if(c){var antes=c.valor;c.valor=novo;render();gravar(function(){return atualizarLinha('Checkins',c)},function(){c.valor=antes})}
  else{c={id:novoId('C'),habito_id:h.id,data:s,valor:novo,criado_em:stamp()};S.checkins.push(c);render();gravar(function(){return anexar('Checkins',c)},function(){S.checkins=S.checkins.filter(function(x){return x!==c})})}
  if(novo>=meta&&atual<meta){vibrar();if(s===hoje())mascHabito(h)}
}
function vibrar(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

/* ---------- seleções ---------- */
function abertas(){return S.tarefas.filter(function(t){return t.status==='aberta'&&!t.tarefa_mae_id})}
function ordenar(a,b){
  if((a.data||'9')!==(b.data||'9'))return (a.data||'9')<(b.data||'9')?-1:1;
  if((a.hora||'99')!==(b.hora||'99'))return (a.hora||'99')<(b.hora||'99')?-1:1;
  if((+a.prioridade||3)!==(+b.prioridade||3))return (+a.prioridade||3)-(+b.prioridade||3);
  return a.criado_em<b.criado_em?-1:1;
}
function doDia(s){return abertas().filter(function(t){return t.data===s}).sort(ordenar)}
// repetições futuras, só para mostrar no calendário; viram tarefa de verdade quando a anterior é concluída
function previstasEntre(ini,fim){
  var mapa={},h=hoje(),ab=abertas();if(ini<h)ini=h;
  ab.forEach(function(t){if(!t.repeticao||!t.data)return;
    var d=t.data,n=0;
    while(n++<400){var prox=nextOccurrence(t.repeticao,d,d);if(!prox||prox<=d)break;d=prox;if(d>fim)break;
      if(d<ini)continue;
      if(ab.some(function(x){return x!==t&&x.titulo===t.titulo&&x.data===d&&x.repeticao===t.repeticao}))continue;
      (mapa[d]=mapa[d]||[]).push(Object.assign({},t,{data:d,_prev:true}))}
  });
  return mapa;
}
function atrasadas(){var h=hoje();return abertas().filter(function(t){return t.data&&t.data<h}).sort(ordenar)}
function feitasNoDia(s){return S.tarefas.filter(function(t){return t.status==='feita'&&!t.tarefa_mae_id&&String(t.concluida_em).slice(0,10)===s})}
function filhas(t){return S.tarefas.filter(function(x){return x.tarefa_mae_id===t.id&&x.status!=='excluida'})}

function tarefaHtml(t,opts){
  opts=opts||{};var h=hoje();
  var meta=[];
  if(opts.mostrarData&&t.data)meta.push('<span class="'+(t.data<h&&t.status==='aberta'?'late':'')+'">'+IC.cal+esc(rotuloData(t.data,h))+'</span>');
  if(t.hora)meta.push('<span>'+IC.clock+esc(t.hora)+'</span>');
  var l=lista(t.lista_id);if(l)meta.push('<span><i class="ldot" style="background:'+esc(l.cor)+'"></i>'+esc(l.nome)+'</span>');
  if(t.repeticao)meta.push('<span>'+IC.rep+esc(repLabel(t.repeticao))+'</span>');
  var f=filhas(t);if(f.length)meta.push('<span>'+IC.sub+f.filter(function(x){return x.status==='feita'}).length+'/'+f.length+'</span>');

    '<button class="tbody" data-act="edit" aria-label="'+esc(t.titulo)+', repetição prevista. Abrir a série"><div class="ttl">'+esc(t.titulo)+'</div><div class="meta"><span class="pvtag">Prevista</span>'+meta.join('')+'</div></button></div></div>';
  return '<div class="task'+(t.status==='feita'?' done':'')+'" data-id="'+esc(t.id)+'">'+
    '<div class="under '+(t.status==='feita'?'later':'done')+'" aria-hidden="true"><span>'+(t.status==='feita'?'Reabrir':'Feita')+'</span><span class="l">Adiar</span></div>'+
    '<div class="tin"><button class="check'+(p===1?' p1':p===2?' p2':'')+'" data-act="check" aria-label="'+(t.status==='feita'?'Reabrir':'Concluir')+' '+esc(t.titulo)+'">'+IC.check+'</button>'+
    '<button class="tbody" data-act="edit"><div class="ttl">'+esc(t.titulo)+'</div>'+(meta.length?'<div class="meta">'+meta.join('')+'</div>':'')+'</button></div></div>';

function listaHtml(ts,opts,vazio){
  if(!ts.length)return vazio===false?'':'<div class="list"><div class="empty">'+(vazio||'Nada por aqui.')+'</div></div>';
  return '<div class="list">'+ts.map(function(t){return tarefaHtml(t,opts)}).join('')+'</div>';
}
function cabecalhoDia(s){var h=hoje();var d=parseYmd(s);var r=rotuloData(s,h);
  var extra=(r==='Hoje'||r==='Amanhã')?WD_NOME[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]:d.getDate()+' de '+MESES[d.getMonth()];
  return '<h3>'+esc(r)+'<small>'+esc(extra)+'</small></h3>'}

function anel(pct,lbl,cor){
  var r=27,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,pct)));
  return '<div class="ring"><svg viewBox="0 0 64 64"><defs><linearGradient id="g'+cor+'" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7D83FF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F28CC4"/></linearGradient></defs>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="var(--sunk)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="url(#g'+cor+')" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'"/></svg><div class="lbl num">'+lbl+'</div></div>';
}

function renderTarefas(){
  var h=hoje(),v=S.visao||'hoje';
  var feitasHoje=feitasNoDia(h),doHoje=doDia(h),late=atrasadas();
  var total=feitasHoje.length+doHoje.length;
  var habs=habitosHoje().filter(function(x){return x.frequencia!=='semana'});
  var faltam=habs.filter(function(x){return !habitoCumpridoHoje(x)}).length;
  var out='<section class="card today">'+anel(total?feitasHoje.length/total:0,feitasHoje.length+'/'+total,'a')+
    '<div><h2>'+(total===0?'Dia livre':feitasHoje.length===total?'Tudo feito hoje':feitasHoje.length+' de '+total+' feitas hoje')+'</h2>'+
    '<p>'+(late.length?late.length+(late.length===1?' atrasada':' atrasadas')+' · ':'')+(habs.length?(faltam?faltam+(faltam===1?' hábito faltando':' hábitos faltando'):'Hábitos do dia em dia'):'Nenhum hábito para hoje')+'</p></div></section>';
  var vs=[['hoje','Hoje'],['amanha','Amanhã'],['3dias','3 dias'],['7dias','7 dias'],['tudo','Tudo']];
  out+='<div class="chips" role="group" aria-label="Visão">'+vs.map(function(x){return '<button class="chip" data-visao="'+x[0]+'" aria-pressed="'+(v===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';

  var lateBloco=function(){
    if(!late.length||cfg('mostrar_atrasadas','sim')==='nao')return '';

  };
  if(v==='hoje'){
    out+=lateBloco();
    out+='<div class="group"><div class="ghead">'+cabecalhoDia(h)+'</div>'+listaHtml(doHoje,{},feitasHoje.length?sprite('contente','mini')+'Tudo feito por hoje.':sprite('feliz','mini')+'Nenhuma tarefa para hoje. Toque no + para anotar.')+'</div>';
    if(feitasHoje.length)out+='<details class="donebox"><summary>Feitas hoje ('+feitasHoje.length+')</summary>'+listaHtml(feitasHoje)+'</details>';
  }else if(v==='amanha'){
    var a=addDays(h,1);
    out+='<div class="group"><div class="ghead">'+cabecalhoDia(a)+'</div>'+listaHtml(doDia(a),{},'Nada marcado para amanhã.')+'</div>';
  }else if(v==='3dias'||v==='7dias'){
    var n=v==='3dias'?3:7;out+=lateBloco();
    for(var i=0;i<n;i++){var s=addDays(h,i);var ts=doDia(s);
      out+='<div class="group"><div class="ghead">'+cabecalhoDia(s)+(ts.length?'<small class="num" style="color:var(--muted);font-size:12.5px">'+ts.length+'</small>':'')+'</div>'+(ts.length?listaHtml(ts):'<div class="list"><div class="free">Livre</div></div>')+'</div>'}
  }else{
    var sem=abertas().filter(function(t){return !t.data}).sort(ordenar);
    out+='<div class="group"><div class="ghead"><h3>Sem data<small>'+sem.length+'</small></h3></div>'+listaHtml(sem,{},'Tudo que não tem data aparece aqui.')+'</div>';
    S.listas.forEach(function(l){
      var ts=abertas().filter(function(t){return t.lista_id===l.id&&t.data}).sort(ordenar);
      if(!ts.length)return;
      out+='<div class="group"><div class="ghead"><h3><i class="ldot" style="background:'+esc(l.cor)+';margin-right:8px;vertical-align:2px"></i>'+esc(l.nome)+'<small>'+ts.length+'</small></h3></div>'+listaHtml(ts,{mostrarData:true})+'</div>';
    });
    var orf=abertas().filter(function(t){return t.data&&!lista(t.lista_id)}).sort(ordenar);
    if(orf.length)out+='<div class="group"><div class="ghead"><h3>Outras</h3></div>'+listaHtml(orf,{mostrarData:true})+'</div>';
  }
  return out;
}

function ligarArrastar(){
  document.querySelectorAll('#view .task:not(.prev)').forEach(function(el){
    var tin=el.querySelector('.tin'),x0=0,y0=0,dx=0,ativo=false,decidido=false;
    el.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;x0=e.clientX;y0=e.clientY;dx=0;ativo=true;decidido=false});
    el.addEventListener('pointermove',function(e){if(!ativo)return;var mx=e.clientX-x0,my=e.clientY-y0;
      if(!decidido){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.4){decidido=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(my)>10){ativo=false;return}else return}
      dx=mx;el.classList.add('arr');tin.style.transition='none';tin.style.transform='translateX('+dx+'px)';
      el.querySelector('.under').className='under '+(dx>0?(el.classList.contains('done')?'later':'done'):'later')});
    var fim=function(){if(!ativo)return;ativo=false;tin.style.transition='';var t=tarefaPorId(el.dataset.id);setTimeout(function(){el.classList.remove('arr')},220);
      if(decidido&&dx>90&&t){tin.style.transform='translateX(110%)';setTimeout(function(){concluir(t)},160)}
      else if(decidido&&dx<-90&&t){tin.style.transform='';abrirAdiar(t)}
      else tin.style.transform=''};
    el.addEventListener('pointerup',fim);el.addEventListener('pointercancel',fim);
  });
}

    '5. Se o texto não diz o dia, ou se está ambíguo, PROPONHA o dia e o horário mais sensatos (prazo citado; horário comercial para ligações e reuniões; antes do vencimento para pagamentos; sem pista nenhuma, hoje se ainda der tempo, senão amanhã). Nesse caso certeza = "baixa" e motivo em até 8 palavras.\n'+
    '6. Se o dia está claro no texto, certeza = "alta" e hora só se o texto disser.\n'+
    '7. repete: se o texto disser que a tarefa se repete, escreva a repetição numa destas formas: "todo dia", "dias uteis", "toda segunda" (ou "toda segunda e quinta"), "toda semana", "todo dia 10", "todo mes", "a cada 3 dias". Se não repete, "". Não coloque a repetição em quando_texto.\n'+

// primeira data que combina com a repetição, a partir da data escolhida (ou de hoje)
function alinharData(rep,data){
  rep=repPartes(rep).base;var h=hoje(),d=data&&data>=h?data:h;if(!rep)return data;
  var ok=function(s){
    if(rep==='dias_uteis')return weekday(s)!==0&&weekday(s)!==6;
    if(rep.indexOf('semanal')===0){var set=(rep.split(':')[1]||'').split(',');return !set[0]||set.indexOf(WD[weekday(s)])>=0}
    if(rep.indexOf('mensal')===0){var n=+(rep.split(':')[1]);if(!n)return true;var p=parseYmd(s);return p.getDate()===Math.min(n,daysInMonth(p.getFullYear(),p.getMonth()))}
    return true};
  for(var i=0;i<62;i++){var c=addDays(d,i);if(ok(c))return c}
  return d;
}
// trocar a data de uma tarefa semanal de um dia só (ou mensal) leva a repetição junto
function reancorar(rep,data){var o=repPartes(rep);o.base=reancorarBase(o.base,data);return repMontar(o)}
function reancorarBase(rep,data){
  if(!data)return rep;
  if(/^semanal:[a-z]{3}$/.test(rep))return 'semanal:'+WD[weekday(data)];
  if(/^mensal:\d+$/.test(rep))return 'mensal:'+parseYmd(data).getDate();
  return rep;
}

var MASC_COR={c:'#3A3F9E',b:'#7D83FF',B:'#5A5FE8',l:'#4A4FC9',p:'#FFFFFF',e:'#1B1B2E',k:'#F28CC4',d:'#4D9DFF',t:'#FF6B8A'};
var MASC_BASE=[
  '.....cccc.....',
  '..bbbccccbbb..',
  '.bbbbbbbbbbbb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bppppppppppb.',
  '.bbbbbbbbbbbb.',
  '..BBBBBBBBBB..',
  '...ll....ll...',
  '..lll....lll..'];
var OLHO_FELIZ=[[4,4],[4,5],[9,4],[9,5]],SORRISO=[[5,7,'e'],[8,7,'e'],[6,8,'e'],[7,8,'e']],BOCHECHAS=[[3,7,'k'],[10,7,'k']];
var OLHO_ARCO=[[4,4,'e'],[3,5,'e'],[5,5,'e'],[9,4,'e'],[8,5,'e'],[10,5,'e']];
var MASC_ROSTO={
  feliz:{olhos:OLHO_FELIZ,resto:BOCHECHAS.concat(SORRISO)},
  contente:{resto:OLHO_ARCO.concat(BOCHECHAS,SORRISO)},
  festa:{cima:true,resto:OLHO_ARCO.concat([[5,7,'e'],[6,7,'e'],[7,7,'e'],[8,7,'e'],[6,8,'t'],[7,8,'t']],BOCHECHAS)},
  preocupado:{olhos:OLHO_FELIZ,resto:[[5,8,'e'],[6,8,'e'],[7,8,'e'],[8,8,'e'],[11,3,'d'],[11,4,'d']]},
  dormindo:{resto:[[3,5,'e'],[4,5,'e'],[9,5,'e'],[10,5,'e'],[6,8,'e'],[7,8,'e']].concat(BOCHECHAS)},
  pensando:{olhos:[[5,3],[5,4],[10,3],[10,4]],resto:[[7,8,'e'],[8,8,'e']]},
  confuso:{olhos:[[4,4],[4,5],[9,5]],resto:[[5,8,'e'],[6,7,'e'],[7,8,'e'],[8,7,'e']]}
};
function pixel(x,y,c){return '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+MASC_COR[c]+'"/>'}
function sprite(humor,cls){
  var f=MASC_ROSTO[humor]||MASC_ROSTO.feliz,r='',o='';
  MASC_BASE.forEach(function(row,y){var x=0;while(x<row.length){var ch=row[x];if(ch==='.'){x++;continue}var x2=x;while(x2<row.length&&row[x2]===ch)x2++;
    r+='<rect x="'+x+'" y="'+y+'" width="'+(x2-x)+'" height="1" fill="'+MASC_COR[ch]+'"/>';x=x2}});
  (f.cima?[[0,1],[0,2],[0,3],[13,1],[13,2],[13,3]]:[[0,6],[0,7],[13,6],[13,7]]).forEach(function(p){r+=pixel(p[0],p[1],'b')});
  (f.resto||[]).forEach(function(p){r+=pixel(p[0],p[1],p[2])});
  (f.olhos||[]).forEach(function(p){o+=pixel(p[0],p[1],'e')});
  return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 -1 14 15" shape-rendering="crispEdges" aria-hidden="true"><g class="corpo">'+r+(o?'<g class="olho">'+o+'</g>':'')+'</g></svg>';
}

var Masc={humor:null,temp:false,tempT:null,falaT:null,toques:0,toqueT:null,dica:0,novas:0,novasT:null,saudou:false};
function sorteio(a){return a[Math.floor(Math.random()*a.length)]}
function mascLigado(){return cfg('mascote','sim')!=='nao'}
function humorBase(){
  if(S.erro&&!S.erro.leve)return 'confuso';
  var hr=new Date().getHours();if(hr>=23||hr<6)return 'dormindo';

function confete(){

    var c=document.createElement('div');c.className='confete';c.style.left=cx+'px';c.style.top=cy+'px';c.style.background=cores[i%cores.length];document.body.appendChild(c);

  var partes=[];if(n)partes.push(n+(n===1?' tarefa':' tarefas'));if(hb)partes.push(hb+(hb===1?' hábito':' hábitos'));

function mascNova(){
  Masc.novas++;clearTimeout(Masc.novasT);
  Masc.novasT=setTimeout(function(){var n=Masc.novas;Masc.novas=0;mascReagir('feliz','pula',n===1?sorteio(['Anotado!','Guardei aqui.','Pode deixar comigo.']):'Anotei '+n+' tarefas.',2000)},700);
}
function mascHabito(x){
  var hj=hoje(),dia=habitosHoje().filter(function(q){return q.frequencia!=='semana'});
  if(dia.length>1&&dia.every(habitoCumpridoHoje)){mascReagir('festa','pula','Hábitos do dia completos!',3200);confete();return}
  var sq=sequencia(x,hj,function(s){return valorDia(x.id,s)},cfg('inicio_semana','seg'));
  if([3,7,14,21,30,50,100,365].indexOf(sq.n)>=0){mascReagir('festa','pula',sq.n+' '+sq.unidade+(sq.unidade.indexOf('semana')===0?' seguidas':' seguidos')+' de '+x.nome+'!',3200);confete();return}
  mascReagir('contente','pula',sorteio(['Hábito marcado!','Mais um dia na conta.',x.nome+': feito!']),2200);
}

var toastT=null;
function toast(msg,desfazer){
  $('toastMsg').textContent=msg;var u=$('toastUndo');u.hidden=!desfazer;u.onclick=function(){$('toast').classList.remove('on');if(desfazer)desfazer()};
  $('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on')},desfazer?5000:2600);
}

function iniciar(){
  // abre na hora com a última cópia guardada no aparelho
  try{var c=JSON.parse(ls('tarefeiro.cache.'+planilhaId())||'null');if(c){S.tarefas=c.tarefas;S.listas=c.listas;S.habitos=c.habitos;S.checkins=c.checkins;S.config=c.config;S.visao=cfg('visao_padrao','hoje');S.carregado=true;S.ultimaCarga=+c.em||0}}catch(e){}
  if(!S.carregado)dadosExemplo();
  render();
  if(!window.claude||!window.claude.use){mcp=null;dadosExemplo();render();mascSaudar();return}
  window.claude.use('permissions').then(function(p){perms=p;if(p&&p.request)p.request().catch(function(){})}).catch(function(){});
  window.claude.use('sample').then(function(s){sample=s;if(S.tab==='mais')render()}).catch(function(){});
  window.claude.use('mcp').then(function(m){
    mcp=m;
    if(!m){dadosExemplo();S.erro=null;render();mascSaudar();return}
    if(S.exemplo){S.tarefas=[];S.habitos=[];S.checkins=[];S.exemplo=false;render()}
    // cópia do aparelho com menos de 2 minutos: não precisa ler de novo (o app do celular recarrega a página com frequência)
    if(S.carregado&&Date.now()-S.ultimaCarga<120000){render();mascSaudar()}else carregar();
  }).catch(function(){mcp=null;dadosExemplo();render()});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&mcp&&Date.now()-S.ultimaCarga>120000)carregar(true)});
setInterval(checarAlertas,30000);setTimeout(checarAlertas,3000);
setInterval(function(){mascAtualizar();if(!document.hidden&&mcp&&Date.now()-S.ultimaCarga>600000)carregar(true)},60000);
iniciar();
</script>
